<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001838"/>
      <stop offset="50%" stop-color="#002D5A"/>
      <stop offset="100%" stop-color="#004B93"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#006CD9"/>
      <stop offset="60%" stop-color="#004B93"/>
      <stop offset="100%" stop-color="#002247"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF275"/>
      <stop offset="50%" stop-color="#FFD100"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background Rounded App Icon Container -->
  <rect width="200" height="200" rx="44" fill="url(#bgGrad)"/>
  
  <!-- Subtle Glow Ring -->
  <rect x="3" y="3" width="194" height="194" rx="41" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.65"/>

  <!-- Left Golden Wing -->
  <g filter="url(#shadow)">
    <path d="M72 110 C38 108, 14 94, 8 72 C26 77, 52 82, 74 94 Z" fill="url(#goldGrad)" stroke="#B87D00" stroke-width="2" />
    <path d="M68 118 C40 120, 20 110, 14 96 C32 101, 52 103, 70 106 Z" fill="#FFE66D" stroke="#B87D00" stroke-width="1.5" />
  </g>

  <!-- Right Golden Wing -->
  <g filter="url(#shadow)">
    <path d="M128 110 C162 108, 186 94, 192 72 C174 77, 148 82, 126 94 Z" fill="url(#goldGrad)" stroke="#B87D00" stroke-width="2" />
    <path d="M132 118 C160 120, 180 110, 186 96 C168 101, 148 103, 130 106 Z" fill="#FFE66D" stroke="#B87D00" stroke-width="1.5" />
  </g>

  <!-- Central Shield Badge -->
  <g filter="url(#shadow)">
    <rect x="52" y="56" width="96" height="74" rx="22" fill="url(#badgeGrad)" stroke="url(#goldGrad)" stroke-width="4.5"/>
    
    <!-- Gloss Highlight -->
    <path d="M60 64 C60 60, 64 58, 68 58 H132 C136 58, 140 60, 140 64 V78 C116 88, 80 88, 60 78 Z" fill="#ffffff" fill-opacity="0.25"/>
    
    <!-- STI Bold Typography -->
    <text x="100" y="107" text-anchor="middle" fill="#FFD100" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="38" letter-spacing="1.5">STI</text>
  </g>

  <!-- Academic Cap Mini Badge -->
  <g transform="translate(100, 48) scale(0.9)" filter="url(#shadow)">
    <polygon points="0,-14 20,-4 0,6 -20,-4" fill="#FFD100"/>
    <polygon points="-12,0 -12,8 0,13 12,8 12,0 0,5" fill="#FFE66D"/>
    <circle cx="16" cy="4" r="2.5" fill="#D97706"/>
    <line x1="16" y1="4" x2="16" y2="12" stroke="#D97706" stroke-width="1.5"/>
  </g>

  <!-- Subtitle Tag -->
  <text x="100" y="162" text-anchor="middle" fill="#FFFFFF" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="11" letter-spacing="2.5">AIM HIGH</text>
  <text x="100" y="176" text-anchor="middle" fill="#FFD100" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="8.5" letter-spacing="1">LAOAG SKIES</text>
</svg>